# =====================================================================
# Multi-subnet topology
# Fixes the gaps found in the audit of the AI's original draft:
#   - private_subnet is now internal (no route to the internet)
#   - fixed, documented subnet ranges
#   - backend health checks that actually call /healthz
#   - nginx waits until backends are healthy, not just started
# =====================================================================

# Shared settings for both backend replicas.
x-backend: &backend
  build: .
  expose:
    - "8000" # visible to other containers only, NOT the host
  networks:
    - private_subnet # private network ONLY
  healthcheck:
    test:
      [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
      ]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 5s

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80" # the ONLY port published to the host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - public_subnet # dual-homed: the only service on both networks
      - private_subnet
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy

  backend1:
    <<: *backend
    environment:
      SERVER_ID: backend1

  backend2:
    <<: *backend
    environment:
      SERVER_ID: backend2

networks:
  public_subnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.1.0/24
  private_subnet:
    driver: bridge
    internal: true # isolated: no outbound internet, no host access
    ipam:
      config:
        - subnet: 172.28.2.0/24
