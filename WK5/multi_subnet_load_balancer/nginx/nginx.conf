# =====================================================================
# Reverse proxy / load balancer (CORRECTED VERSION)
# Fixes the gaps found in the audit of the AI's original draft:
#   - connection/read timeouts                     (was: 60 s defaults)
#   - proxy_next_upstream retry policy             (was: missing)
#   - passive health checks (max_fails/fail_timeout)
#   - DNS re-resolution so a restarted backend rejoins the pool
#   - forwarded client headers, single Content-Type on /healthz
# =====================================================================

error_log /var/log/nginx/error.log warn;

events {}

http {
    # Docker's embedded DNS server. Service names are re-resolved every
    # 5 s, so a stopped backend drops out and a restarted one rejoins.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Access log shows WHICH backend handled each request and any retries
    # (e.g. upstream=172.28.2.10:8000, 172.28.2.11:8000 status=504, 200).
    log_format upstreamlog '$remote_addr "$request" $status '
                           'upstream=$upstream_addr '
                           'upstream_status=$upstream_status '
                           'time=${request_time}s';
    access_log /var/log/nginx/access.log upstreamlog;

    upstream backend_pool {
        # No algorithm directive = ROUND-ROBIN (stated explicitly here).
        # Requests are stateless, so no ip_hash / sticky sessions.
        zone backend_pool 64k;   # shared memory, required for 'resolve'

        # Docker service names (no hardcoded IPs).
        # resolve      = re-check DNS (uses the resolver above)
        # max_fails=1  = mark a backend down after 1 failed attempt...
        # fail_timeout = ...for 5 s, then try it again
        server backend1:8000 resolve max_fails=1 fail_timeout=5s;
        server backend2:8000 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;

        # Shows which backend answered, visible in browser DevTools.
        add_header X-Upstream-Server $upstream_addr always;

        # ---- Load balancer's own health check -----------------------
        location = /healthz {
            default_type text/plain;     # one Content-Type header only
            return 200 "nginx healthy\n";
        }

        # ---- Backend health, checked THROUGH the load balancer -------
        location = /healthz/backend {
            proxy_pass http://backend_pool/healthz;
        }

        # ---- Browser favicon: answer here so it does not take a turn
        #      in the round-robin rotation or log a console error ------
        location = /favicon.ico {
            access_log off;
            return 204;
        }

        # ---- Browser DevTools probe: answer here so it does not
        #      take a turn in the round-robin rotation --------------
        location = /.well-known/appspecific/com.chrome.devtools.json {
            access_log off;
            return 204;
        }

        # ---- Application traffic -------------------------------------
        location / {
            proxy_pass http://backend_pool;
        }

        # ---- Settings shared by every proxied location ---------------
        # Fail fast: give up on an unreachable backend after 1 s.
        proxy_connect_timeout 1s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        # Retry the request on the next backend if one fails, so the
        # client never sees the failure (zero dropped requests).
        proxy_next_upstream         error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 5s;

        # Pass the real client details to the backends.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
