events {}

http {
    upstream backend_pool {
        server backend1:8000;
        server backend2:8000;
    }

    server {
        listen 80;

        location /healthz {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://backend_pool;
        }
    }
}
